# Everything the other teams run. Your Claims API and the gateway run outside Docker,
# so you can edit and restart them yourself.
#
#   docker compose up -d     start everything
#   docker compose ps        check what's running
#   docker compose down -v   stop everything and delete Kafka's data

name: insurance

services:
  # One Kafka broker, in KRaft mode (no ZooKeeper).
  # Containers reach it at kafka:9092. Code running in the Codespace reaches it at localhost:9094.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: insurance-course-kafka-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  # Creates the course's topics once Kafka is ready, then exits.
  kafka-topics:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in claim-events adjuster-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done

  # The Policies team's subgraph.
  policies:
    build: ../teams/policies
    image: insurance-course/policies
    ports:
      - "4001:4001"

  # The Billing team's subgraph. It reads claim-events and records payouts.
  billing:
    build: ../teams/billing
    image: insurance-course/billing
    ports:
      - "4003:4003"
    environment:
      KAFKA_BROKERS: kafka:9092
      # npm run billing:ship-v2 switches this to 2.
      BILLING_VERSION: ${BILLING_VERSION:-1}
    depends_on:
      kafka-topics:
        condition: service_completed_successfully

  # The app team's Claims Desk. It reads everything through the gateway on port 4000.
  claims-desk:
    build: ../teams/claims-desk
    image: insurance-course/claims-desk
    ports:
      - "3000:3000"
    environment:
      GATEWAY_URL: http://host.docker.internal:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
